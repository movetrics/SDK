<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 310" width="820" height="310" role="img" aria-labelledby="title desc">
<title id="title">How the SDK is checked</title>
<desc id="desc">A written contract produces shared test data: 53 byte-level cases, 7 vocabulary cases and golden files. The Python, TypeScript and MATLAB clients, and any client you write, run the same files; CONFORMANCE.md records which client read which file and passed.</desc>
<style>
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:12.5px}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bg{fill:#fcfcfb;stroke:#e4e3df}
.t1{fill:#1b1b1a} .t2{fill:#5a5955} .t3{fill:#7a7974}
.box{fill:#f3f2ef;stroke:#cfcec8}
.dash{fill:none;stroke:#9a9993;stroke-dasharray:5 4}
.acc{fill:#e3f6f0;stroke:#0f7a63} .accT{fill:#0b5e4c}
.acc2{fill:#e5f0fb;stroke:#2a78d6} .acc2T{fill:#174f91}
.ln{stroke:#6a6964;fill:none} .head{fill:#6a6964}
.curve{stroke:#0f7a63;fill:none} .band{fill:#e3f6f0}
.grid{stroke:#e9e8e4} .axis{stroke:#b5b4ae}
@media (prefers-color-scheme: dark){
.bg{fill:#1a1a19;stroke:#33322f}
.t1{fill:#f0efec} .t2{fill:#c3c2b7} .t3{fill:#9a998f}
.box{fill:#252523;stroke:#45443f} .dash{stroke:#7a7972}
.acc{fill:#0b2f2a;stroke:#3fbf9c} .accT{fill:#9fe8d2}
.acc2{fill:#13263d;stroke:#3987e5} .acc2T{fill:#a9cdf5}
.ln{stroke:#a9a89f} .head{fill:#a9a89f}
.curve{stroke:#3fbf9c} .band{fill:#0f2c27}
.grid{stroke:#2c2b29} .axis{stroke:#4a4944}
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path class="head" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0.5" y="0.5" width="819" height="309" rx="12"/>
<text class="t1" x="16" y="30" text-anchor="start" font-size="15" font-weight="600"><tspan x="16" dy="0">One contract, one set of test data, every client</tspan></text>
<rect class="acc" x="16" y="92" width="180" height="118" rx="8" stroke-width="1.5"/>
<text class="accT" x="106.0" y="131.0" text-anchor="middle" font-size="14" font-weight="600"><tspan x="106.0" dy="0">The contract</tspan></text>
<text class="accT" x="106.0" y="149.0" text-anchor="middle"><tspan x="106.0" dy="0">docs/: every byte</tspan><tspan x="106.0" dy="16">vocabulary: names,</tspan><tspan x="106.0" dy="16">units, axes, signs</tspan></text>
<rect class="box" x="236" y="92" width="190" height="118" rx="8" stroke-width="1.5"/>
<text class="t1" x="331.0" y="131.0" text-anchor="middle" font-size="14" font-weight="600"><tspan x="331.0" dy="0">Shared test data</tspan></text>
<text class="t2" x="331.0" y="149.0" text-anchor="middle"><tspan x="331.0" dy="0">vectors/: 53 byte cases,</tspan><tspan x="331.0" dy="16">7 vocabulary cases,</tspan><tspan x="331.0" dy="16">sync and C3D golden files</tspan></text>
<path class="ln" d="M196 151L234 151" stroke-width="1.5" marker-end="url(#a)"/>
<rect class="box" x="466" y="48" width="168" height="46" rx="8" stroke-width="1.5"/>
<text class="t1" x="550" y="68" text-anchor="middle" font-size="13.5" font-weight="600"><tspan x="550" dy="0">Python</tspan></text>
<text class="t2" x="550" y="84" text-anchor="middle" font-size="11.5"><tspan x="550" dy="0">250 tests</tspan></text>
<path class="ln" d="M426 151C446 151 446 71 464 71" stroke-width="1.5" marker-end="url(#a)"/>
<path class="ln" d="M634 71C652 71 652 151 670 151" stroke-width="1.5" marker-end="url(#a)"/>
<rect class="box" x="466" y="106" width="168" height="46" rx="8" stroke-width="1.5"/>
<text class="t1" x="550" y="126" text-anchor="middle" font-size="13.5" font-weight="600"><tspan x="550" dy="0">TypeScript</tspan></text>
<text class="t2" x="550" y="142" text-anchor="middle" font-size="11.5"><tspan x="550" dy="0">202 tests</tspan></text>
<path class="ln" d="M426 151C446 151 446 129 464 129" stroke-width="1.5" marker-end="url(#a)"/>
<path class="ln" d="M634 129C652 129 652 151 670 151" stroke-width="1.5" marker-end="url(#a)"/>
<rect class="box" x="466" y="164" width="168" height="46" rx="8" stroke-width="1.5"/>
<text class="t1" x="550" y="184" text-anchor="middle" font-size="13.5" font-weight="600"><tspan x="550" dy="0">MATLAB</tspan></text>
<text class="t2" x="550" y="200" text-anchor="middle" font-size="11.5"><tspan x="550" dy="0">61 checks, in Octave</tspan></text>
<path class="ln" d="M426 151C446 151 446 187 464 187" stroke-width="1.5" marker-end="url(#a)"/>
<path class="ln" d="M634 187C652 187 652 151 670 151" stroke-width="1.5" marker-end="url(#a)"/>
<rect class="dash" x="466" y="222" width="168" height="46" rx="8" stroke-width="1.5"/>
<text class="t1" x="550" y="242" text-anchor="middle" font-size="13.5" font-weight="600"><tspan x="550" dy="0">Your client</tspan></text>
<text class="t2" x="550" y="258" text-anchor="middle" font-size="11.5"><tspan x="550" dy="0">C#, Swift, Rust, …</tspan></text>
<path class="ln" d="M426 151C446 151 446 245 464 245" stroke-width="1.5" marker-end="url(#a)"/>
<path class="ln" d="M634 245C652 245 652 151 670 151" stroke-width="1.5" marker-end="url(#a)"/>
<rect class="box" x="672" y="102" width="132" height="98" rx="8" stroke-width="1.5"/>
<text class="t1" x="738.0" y="131.0" text-anchor="middle" font-size="14" font-weight="600"><tspan x="738.0" dy="0">CONFORMANCE.md</tspan></text>
<text class="t2" x="738.0" y="149.0" text-anchor="middle"><tspan x="738.0" dy="0">which client</tspan><tspan x="738.0" dy="16">read which file,</tspan><tspan x="738.0" dy="16">and passed</tspan></text>
<text class="t3" x="16" y="292" text-anchor="start" font-size="11.5"><tspan x="16" dy="0">A client is correct when it passes every case; the report never marks a file passed for a client that does not read it.</tspan></text>
</svg>
