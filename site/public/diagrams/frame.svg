<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 238" width="820" height="238" role="img" aria-labelledby="title desc">
<title id="title">The 24-byte stream frame</title>
<desc id="desc">Bytes 0 and 1 are BE EF, byte 2 the plate, byte 3 the code 01, bytes 4 to 7 the time stamp in 0.1 ms ticks, bytes 8 to 19 six signed 16-bit readings, bytes 20 and 21 the CRC over bytes 2 to 19, and bytes 22 and 23 the end marker 04 04.</desc>
