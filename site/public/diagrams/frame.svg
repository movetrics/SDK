.t1{fill:#1A2A4C} .t2{fill:#536175} .t3{fill:#536175}
.box{fill:#EAF0F2;stroke:#D6DEE5}
.dash{fill:none;stroke:#758294;stroke-dasharray:5 4}
.acc{fill:#E0F0ED;stroke:#006B67} .accT{fill:#004D49}
.acc2{fill:#EAF3FF;stroke:#155E9B} .acc2T{fill:#155E9B}
.ln{stroke:#758294;fill:none} .head{fill:#758294}
.curve{stroke:#A24C00;fill:none} .band{fill:#EAF0F2}
.grid{stroke:#DBE1E5} .axis{stroke:#66717C}
@media (prefers-color-scheme: dark){
.bg{fill:#172438;stroke:#34455D}
.t1{fill:#F5F7FA} .t2{fill:#BCC9DB} .t3{fill:#BCC9DB}
